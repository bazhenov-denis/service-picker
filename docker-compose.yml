version: "3.8"
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    container_name: react_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app:cached  # Используйте :cached для улучшения производительности
      - /app/node_modules  # Избегаем конфликтов с node_modules внутри контейнера
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - WATCHPACK_POLLING=true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    container_name: spring_backend
    restart: unless-stopped
